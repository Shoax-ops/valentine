<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Special ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        font-family: Arial, sans-serif;
        text-align: center;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
    }

    h1 {
        font-size: clamp(24px, 5vw, 36px);
        margin-bottom: 10px;
        z-index: 2;
    }

    h2, p {
        font-size: clamp(16px, 4vw, 20px);
        z-index: 2;
    }

    #heart {
        position: absolute;
        font-size: 40px;
        cursor: pointer;
        z-index: 3;
    }

    .content {
        max-width: 500px;
        z-index: 3;
    }

    button {
        padding: 12px 25px;
        margin: 10px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        position: relative;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
    }

    #noBtn {
        background-color: #ccc;
        position: absolute;
    }

    /* Floating hearts */
    .floating-heart {
        position: absolute;
        bottom: -20px;
        font-size: 20px;
        animation: floatUp linear infinite;
        opacity: 0.8;
        pointer-events: none;
    }

    @keyframes floatUp {
        from {
            transform: translateY(0);
            opacity: 0.8;
        }
        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="content" id="gameArea">
    <h1>Catch 5 Hearts 💕</h1>
    <h2 id="score">Hearts Caught: 0</h2>
</div>

<div id="heart">❤️</div>

<script>
    const heart = document.getElementById("heart");
    const scoreText = document.getElementById("score");

    let score = 0;

    function moveHeart() {
        const padding = 60;
        const x = Math.random() * (window.innerWidth - padding);
        const y = Math.random() * (window.innerHeight - padding);
        heart.style.left = x + "px";
        heart.style.top = y + "px";
    }

    heart.addEventListener("click", function() {
        score++;
        scoreText.textContent = "Hearts Caught: " + score;
        moveHeart();

        if(score === 5) {
            showValentineMessage();
        }
    });

    function showValentineMessage() {
        document.body.innerHTML = `
            <div class="content" style="margin-top:50px;">
                <h1>Hey Beautiful ❤️</h1>
                <p>
                    I tried debugging my feelings... <br>
                    Turns out they’re not errors. <br>
                    They’re real. <br><br>
                    So... will you be my Valentine?
                </p>
                <div style="margin-top:20px;">
                    <button id="yesBtn">Yes 💖</button>
                    <button id="noBtn">No 😅</button>
                </div>
            </div>
        `;

        startFloatingHearts();

        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");

        noBtn.addEventListener("touchstart", moveNoButton);
        noBtn.addEventListener("mouseover", moveNoButton);

        function moveNoButton() {
            const padding = 100;
            const x = Math.random() * (window.innerWidth - padding);
            const y = Math.random() * (window.innerHeight - padding);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        yesBtn.addEventListener("click", function() {
            document.body.innerHTML = `
                <div class="content" style="margin-top:100px;">
                    <h1>You just made me the happiest guy ❤️</h1>
                    <h2>Can’t wait for our Valentine’s date yeey</h2>
                </div>
            `;
            startFloatingHearts();
        });
    }

    function createFloatingHeart() {
        const floatingHeart = document.createElement("div");
        floatingHeart.classList.add("floating-heart");
        floatingHeart.innerHTML = "❤️";
        floatingHeart.style.left = Math.random() * 100 + "vw";
        floatingHeart.style.animationDuration = (Math.random() * 3 + 3) + "s";
        floatingHeart.style.fontSize = (Math.random() * 15 + 15) + "px";

        document.body.appendChild(floatingHeart);

        setTimeout(() => {
            floatingHeart.remove();
        }, 6000);
    }




    function startFloatingHearts() {
        setInterval(createFloatingHeart, 400);
    }

    startFloatingHearts();
    moveHeart();
</script>

</body>
</html>
